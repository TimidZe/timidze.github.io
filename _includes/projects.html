{% assign items = site.projects | sort: 'order' %}
<div class="project-list">
  {% for p in items %}
  {% if p.external %}
  <a class="project-row" href="{{ p.external }}" target="_blank" rel="noopener">
  {% else %}
  <a class="project-row" href="{{ p.url | relative_url }}">
  {% endif %}
    <div class="project-thumb">
      <img src="{{ p.image | default: '/images/projects/placeholder.svg' | relative_url }}" alt="{{ p.title }}">
    </div>
    <div class="project-info">
      <div class="project-name">{{ p.title }}</div>
      {% if p.subtitle %}<div class="project-tagline">{{ p.subtitle }}</div>{% endif %}
    </div>
  </a>
  {% endfor %}
</div>
