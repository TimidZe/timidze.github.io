<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
</head>
<body>
  <main class="page">
    <article class="card">
      {{ content }}
    </article>
    <footer class="site-footer">
      &copy; {{ site.time | date: "%Y" }} {{ site.author.name }} &middot;
      Built with <a href="https://jekyllrb.com">Jekyll</a>, hosted on GitHub Pages
    </footer>
  </main>
</body>
</html>
