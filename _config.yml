# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title            : "Hongze Song"
description      : "Personal academic homepage of Hongze Song."
url              : "https://timidze.github.io"
baseurl          : ""
repository       : "TimidZe/timidze.github.io"
lang             : "en"

# ---------------------------------------------------------------------------
# Personal information shown in the page header
# (placeholders — replace with your own details)
# ---------------------------------------------------------------------------
author:
  name      : "Hongze Song"
  photo     : "/images/profile.png"
  email     : "imhongze@sjtu.edu.cn"
  # One line per affiliation / title. Add or remove lines freely.
  titles:
    - "MSc Student, China-UK Low Carbon College, Shanghai Jiao Tong University"
    - "PLACEHOLDER: second affiliation / position"
    - "PLACEHOLDER: third affiliation / position"
  # Optional external links shown under the header. Delete any you don't use.
  links:
    - name: "CV"
      url: "/files/cv.pdf"
    - name: "Google Scholar"
      url: "PLACEHOLDER"
    - name: "GitHub"
      url: "https://github.com/TimidZe"

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
markdown         : kramdown
kramdown:
  input          : GFM
  auto_ids       : true
  hard_wrap      : false

permalink        : /:title/

collections:
  projects:
    output       : true
    permalink    : /projects/:path/

defaults:
  - scope:
      path       : ""
      type       : "projects"
    values:
      layout     : "project"
  - scope:
      path       : ""
    values:
      layout     : "default"

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
