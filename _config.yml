# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title            : "Hongze Song"
description      : "Personal academic homepage of Hongze Song."
url              : "https://timidze.github.io"
baseurl          : ""
repository       : "TimidZe/timidze.github.io"
lang             : "en"

# ---------------------------------------------------------------------------
# Personal information shown in the page header
# ---------------------------------------------------------------------------
author:
  name      : "Hongze Song"
  photo     : "/images/MyPhoto.jpeg"
  email     : "imhongze@sjtu.edu.cn"
  # One entry per affiliation. `icon` is the little image used as the bullet
  # (put the files in images/logos/).
  titles:
    - text: "M.Sc. in Power Engineering, Shanghai Jiao Tong University (SJTU), Shanghai, China (expected March 2027)"
      icon: "/images/logos/sjtu.png"
    - text: "Summer Research Intern, Aalto Science Institute (AScI), Aalto University, Espoo, Finland"
      icon: "/images/logos/aalto.png"
    - text: "B.Eng. in Mechanical and Electronic Engineering, East China University of Science and Technology (ECUST), Shanghai, China"
      icon: "/images/logos/ecust.png"
  # Optional external links shown under the header (e.g. CV, Google Scholar,
  # GitHub). Currently switched off — uncomment and fill in to show them.
  # links:
  #   - name: "CV"
  #     url: "/files/cv.pdf"

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
markdown         : kramdown
kramdown:
  input          : GFM
  auto_ids       : true
  hard_wrap      : false

permalink        : /:title/

collections:
  projects:
    output       : true
    permalink    : /projects/:path/

defaults:
  - scope:
      path       : ""
      type       : "projects"
    values:
      layout     : "project"
  - scope:
      path       : ""
    values:
      layout     : "default"

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
